<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>CardByte Event Handler</title>

  <!-- Office.js -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <script>
    /* =========================================================
       CARDBYTE – OUTLOOK AUTO-RUN EVENT HANDLER
       ========================================================= */
    let SIGNATURE_STATE = "idle"; // idle | loading | applied

    const SIGNATURE_SPACER = `
            <br>
            <div style="min-height:50px;">&nbsp;</div>
            <br>
        `;

    const SIGNATURE_MARKER = "<!-- CARDBYTE_SIGNATURE -->";

    /* ---------------------------------------------------------
       Config
       --------------------------------------------------------- */
    const AES_KEY = "fnItrY2YfozBqCC2B4XsfqHIvZku3kUOq3DFkbO64kk=";
    const AES_IV = "3YapeNfJDung7TXxeKXn4g==";

    /**
     * Maximum HTML payload size (in characters) that Outlook can reliably
     * handle via body.setAsync with CoercionType.Html.
     */
    const MAX_SAFE_HTML_SIZE = 500_000; // ~500 KB

    /* ---------------------------------------------------------
       Office Ready
       --------------------------------------------------------- */

    Office.onReady(() => {
      window.applySignature({
        completed: async () => {
          console.log("✅ Office.onReady completed");
        }
      });
    });

    /* ---------------------------------------------------------
       AES Encryption / Decryption Helpers
       --------------------------------------------------------- */

    function base64ToArrayBuffer(base64) {
      let base64Data = base64.replace(/-/g, "+").replace(/_/g, "/");
      const padding = base64Data.length % 4;
      if (padding) {
        base64Data += "=".repeat(4 - padding);
      }
      const binaryString = atob(base64Data);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binaryString = "";
      for (let i = 0; i < bytes.length; i++) {
        binaryString += String.fromCharCode(bytes[i]);
      }
      return btoa(binaryString);
    }

    async function handleAesDecrypt(encryptedText, generatedKey) {
      try {
        if (!encryptedText) return "";

        const keyToUse = generatedKey || AES_KEY;

        let keyBuffer;
        try {
          keyBuffer = base64ToArrayBuffer(keyToUse);
        } catch (e) {
          console.error("Failed to decode key as base64:", e);
          return encryptedText;
        }

        if (keyBuffer.byteLength !== 16 && keyBuffer.byteLength !== 32) {
          if (generatedKey && generatedKey !== AES_KEY) {
            return handleAesDecrypt(encryptedText, AES_KEY);
          }
          return encryptedText;
        }

        const ivBuffer = base64ToArrayBuffer(AES_IV);
        if (ivBuffer.byteLength !== 16) {
          return encryptedText;
        }

        const key = await crypto.subtle.importKey(
          "raw",
          keyBuffer,
          { name: "AES-CBC" },
          false,
          ["decrypt"]
        );

        let encryptedBuffer;
        try {
          encryptedBuffer = base64ToArrayBuffer(encryptedText);
        } catch (e) {
          return encryptedText;
        }

        if (encryptedBuffer.byteLength % 16 !== 0) {
          console.error(`❌ Invalid encrypted data length: ${encryptedBuffer.byteLength} bytes`);
          return encryptedText;
        }

        const decryptedBuffer = await crypto.subtle.decrypt(
          { name: "AES-CBC", iv: ivBuffer },
          key,
          encryptedBuffer
        );

        return new TextDecoder().decode(decryptedBuffer);
      } catch (err) {
        if (generatedKey && generatedKey !== AES_KEY && err.message.includes("key data")) {
          try {
            return await handleAesDecrypt(encryptedText, AES_KEY);
          } catch (fallbackError) {
            console.error("Fallback also failed:", fallbackError.message);
          }
        }
        return encryptedText;
      }
    }

    async function encryptEmail(email = "") {
      try {
        if (!email || email.trim() === "") {
          console.warn("Warning: Empty email provided");
          return "";
        }

        const keyBuffer = base64ToArrayBuffer(AES_KEY);
        const ivBuffer = base64ToArrayBuffer(AES_IV);

        if (keyBuffer.byteLength !== 16 && keyBuffer.byteLength !== 32) {
          console.error(`Invalid key length: ${keyBuffer.byteLength} bytes`);
          return "";
        }

        if (ivBuffer.byteLength !== 16) {
          console.error(`Invalid IV length: ${ivBuffer.byteLength} bytes`);
          return "";
        }

        const key = await crypto.subtle.importKey(
          "raw",
          keyBuffer,
          { name: "AES-CBC" },
          false,
          ["encrypt"]
        );

        const data = new TextEncoder().encode(email);

        const encrypted = await crypto.subtle.encrypt(
          { name: "AES-CBC", iv: ivBuffer },
          key,
          data
        );

        const base64Result = arrayBufferToBase64(encrypted);

        try {
          atob(base64Result);
        } catch (e) {
          console.error("✗ Result is NOT valid base64:", e);
        }

        return base64Result;
      } catch (err) {
        console.error("Encryption error:", err);
        return "";
      }
    }

    /* ---------------------------------------------------------
       Server API
       --------------------------------------------------------- */

    async function renderSignatureOnServer(user) {
      try {
        const encryptedMail = await encryptEmail(user);
        console.log("[CardByte] Fetching signature for:", user);

        const res = await fetch(
          "https://newqa-enterprise.cardbyte.ai/email-signature/html/outlook/get-active",
          {
            method: "GET",
            headers: {
              username: encryptedMail
            }
          }
        );

        if (!res.ok) {
          throw new Error(`Server responded with ${res.status}`);
        }

        const data = await res.text();
        const decryptedData = await handleAesDecrypt(data);
        return JSON.parse(decryptedData)?.html;
      } catch (e) {
        console.error("[CardByte] renderSignatureOnServer error:", e);
        return null;
      }
    }

    /* ---------------------------------------------------------
       Large HTML Handling
       --------------------------------------------------------- */

    /**
     * Compresses base64 images to smaller dimensions/quality using Canvas.
     * Returns a Promise<string> with the compressed base64 data URL.
     */
    function compressBase64Image(dataUrl, maxWidth = 300, quality = 0.7) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            let result = canvas.toDataURL("image/jpeg", quality);
            if (result.length >= dataUrl.length) {
              result = canvas.toDataURL("image/png");
            }

            console.log(
              `[CardByte] Compressed image: ${(dataUrl.length / 1024).toFixed(0)}KB → ${(result.length / 1024).toFixed(0)}KB`
            );
            resolve(result);
          } catch (e) {
            console.warn("[CardByte] Canvas compression failed:", e);
            resolve(dataUrl);
          }
        };
        img.onerror = () => {
          console.warn("[CardByte] Image failed to load for compression");
          resolve(dataUrl);
        };
        img.src = dataUrl;
      });
    }

    /**
     * Finds all base64 images in the HTML, compresses them via Canvas,
     * and returns the HTML with smaller embedded images.
     */
    async function compressImagesInHtml(html) {
      const regex = /src\s*=\s*"(data:image\/[^;]+;base64,[^"]+)"/gi;
      const matches = [];
      let match;

      while ((match = regex.exec(html)) !== null) {
        matches.push({
          fullMatch: match[0],
          dataUrl: match[1]
        });
      }

      if (matches.length === 0) return html;

      console.log(`[CardByte] Found ${matches.length} base64 image(s) to compress`);

      let result = html;
      for (const m of matches) {
        const compressed = await compressBase64Image(m.dataUrl);
        result = result.replace(m.dataUrl, compressed);
      }

      return result;
    }

    /**
     * Extracts all base64-encoded images from HTML, replacing them
     * with cid: references for inline attachment.
     */
    function extractBase64Images(html) {
      const images = [];
      let index = 0;

      const cleanedHtml = html.replace(
        /src\s*=\s*"data:(image\/([^;]+));base64,([^"]+)"/gi,
        (_match, mimeType, extension, base64Data) => {
          const cid = `cardbyte_img_${index}`;
          const safeExt = extension.replace(/[^a-z0-9]/gi, "") || "png";
          const fileName = `${cid}.${safeExt}`;

          images.push({ cid, fileName, mimeType, base64Data });
          index++;
          return `src="cid:${cid}"`;
        }
      );

      return { cleanedHtml, images };
    }

    /**
     * Adds a single base64 image as an inline attachment.
     */
    function addInlineImageAttachment(item, { cid, fileName, base64Data }) {
      return new Promise((resolve, reject) => {
        if (typeof item.addFileAttachmentFromBase64Async !== "function") {
          console.warn("[CardByte] addFileAttachmentFromBase64Async not available — skipping:", cid);
          resolve();
          return;
        }

        item.addFileAttachmentFromBase64Async(
          base64Data,
          fileName,
          { isInline: true, contentId: cid },
          (result) => {
            if (result.status === Office.AsyncResultStatus.Succeeded) {
              resolve(result.value);
            } else {
              console.error(`[CardByte] Failed to attach ${cid}:`, result.error);
              reject(result.error);
            }
          }
        );
      });
    }

    /* ---------------------------------------------------------
       Signature Helpers
       --------------------------------------------------------- */

    function stabilizeSelection(_item) {
      return Promise.resolve();
    }

    function setBodyHtml(item, html) {
      return new Promise((resolve, reject) => {
        item.body.setAsync(
          html,
          { coercionType: Office.CoercionType.Html },
          (r) => {
            if (r.status === "succeeded") {
              resolve();
            } else {
              console.error("[CardByte] body.setAsync failed:", JSON.stringify(r.error));
              reject(r.error);
            }
          }
        );
      });
    }

    function wrapForOutlook(innerHtml) {
      return `
        <div style="font-family: Calibri, Arial, sans-serif; font-size: 11pt; mso-line-height-rule: exactly;">
          <table cellpadding="0" cellspacing="0" border="0" style="font-family: inherit; font-size: inherit; color: inherit;">
            <tbody>
              <tr>
                <td style="padding: 0; margin: 0;">
                  ${innerHtml}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    /**
     * Main insertion logic with 4-tier strategy:
     *
     * Strategy 1: Direct insert (if HTML is small enough)
     * Strategy 2: Compress base64 images via Canvas, then direct insert
     * Strategy 3: Extract images as CID inline attachments, insert lightweight HTML
     * Strategy 4: Strip all images, insert text-only signature
     */
    async function insertSignatureWithoutCursorError(item, signatureHtml) {
      try {
        if (window.__INSERTING_SIGNATURE__) return;
        window.__INSERTING_SIGNATURE__ = true;

        await stabilizeSelection(item);

        const wrappedHtml = wrapForOutlook(signatureHtml);
        const fullHtml = `<br/><br/><!-- CARD_BYTE_SIGNATURE_START -->${wrappedHtml}<!-- CARD_BYTE_SIGNATURE_END -->`;

        console.log(`[CardByte] Signature HTML size: ${(fullHtml.length / 1024).toFixed(1)} KB`);

        // ── Strategy 1: Direct insert if small enough ──
        if (fullHtml.length <= MAX_SAFE_HTML_SIZE) {
          console.log("[CardByte] Strategy 1: Direct insert");
          try {
            await setBodyHtml(item, fullHtml);
            console.log("[CardByte] ✅ Strategy 1 succeeded");
            return;
          } catch (e) {
            console.warn("[CardByte] Strategy 1 failed:", e.message || e);
          }
        }

        // ── Strategy 2: Compress images, then direct insert ──
        try {
          console.log("[CardByte] Strategy 2: Compress images then direct insert");
          const compressedHtml = await compressImagesInHtml(fullHtml);
          console.log(`[CardByte] After compression: ${(compressedHtml.length / 1024).toFixed(1)} KB`);

          await setBodyHtml(item, compressedHtml);
          console.log("[CardByte] ✅ Strategy 2 succeeded");
          return;
        } catch (compressErr) {
          console.warn("[CardByte] Strategy 2 failed:", compressErr.message || compressErr);
        }

        // ── Strategy 3: CID inline attachments ──
        try {
          console.log("[CardByte] Strategy 3: CID inline attachments");
          const { cleanedHtml, images } = extractBase64Images(fullHtml);
          console.log(
            `[CardByte] Extracted ${images.length} image(s), HTML now: ${(cleanedHtml.length / 1024).toFixed(1)} KB`
          );

          await setBodyHtml(item, cleanedHtml);

          let attachedCount = 0;
          for (const img of images) {
            try {
              await addInlineImageAttachment(item, img);
              attachedCount++;
              console.log(`[CardByte] ✅ Attached: ${img.cid}`);
            } catch (attachErr) {
              console.warn(`[CardByte] ⚠️ Failed to attach ${img.cid}:`, attachErr);
            }
          }

          console.log(`[CardByte] ✅ Strategy 3 done — ${attachedCount}/${images.length} images attached`);
          return;
        } catch (cidErr) {
          console.error("[CardByte] Strategy 3 failed:", cidErr.message || cidErr);
        }

        // ── Strategy 4: Last resort — strip all images, insert text-only ──
        console.warn("[CardByte] Strategy 4: Stripping all images as last resort");
        const textOnlyHtml = fullHtml.replace(
          /<img[^>]*src\s*=\s*"data:image\/[^"]*"[^>]*\/?>/gi,
          '<span style="color:#999;">[image]</span>'
        );
        await setBodyHtml(item, textOnlyHtml);
        console.log("[CardByte] ✅ Strategy 4 succeeded (images stripped)");

      } catch (err) {
        console.error("[CardByte] All insertion strategies failed:", err);
        throw err;
      } finally {
        window.__INSERTING_SIGNATURE__ = false;
      }
    }

    /* ---------------------------------------------------------
       Body Read + Detection Helpers
       --------------------------------------------------------- */

    function getBodyHtml(item) {
      return new Promise((resolve, reject) => {
        item.body.getAsync(Office.CoercionType.Html, (r) => {
          if (r.status === "succeeded") resolve(r.value || "");
          else reject(r.error);
        });
      });
    }

    function hasCardByteSignature(html) {
      return (
        html.includes("CARD_BYTE_SIGNATURE_START") ||
        html.includes("CARDBYTE_SIGNATURE")
      );
    }

    function looksLikeOutlookDefaultSignature(html) {
      return (
        /class="?MsoNormal"?/i.test(html) ||
        /<meta name="Generator" content="Microsoft Outlook"/i.test(html) ||
        /--<br\s*\/?>/i.test(html) ||
        /Sent from (my )?iPhone/i.test(html)
      );
    }

    function stripOutlookSignature(html) {
      const patterns = [
        /<div class="?MsoNormal"?.*?>/i,
        /--<br\s*\/?>/i,
        /Sent from (my )?iPhone/i
      ];

      for (const p of patterns) {
        const idx = html.search(p);
        if (idx > -1) {
          return html.slice(0, idx).trim();
        }
      }

      return html;
    }

    async function ensureNoOutlookSignature(item) {
      const html = await getBodyHtml(item);

      if (hasCardByteSignature(html)) return false;

      if (looksLikeOutlookDefaultSignature(html)) {
        const cleaned = stripOutlookSignature(html);
        await new Promise((resolve, reject) => {
          item.body.setAsync(
            cleaned,
            { coercionType: Office.CoercionType.Html },
            (r) => (r.status === "succeeded" ? resolve() : reject(r.error))
          );
        });
        return true;
      }

      return false;
    }

    /* ---------------------------------------------------------
       AUTO-RUN ENTRY POINT (MUST BE GLOBAL)
       --------------------------------------------------------- */

    window.applySignature = async function (event = { completed: () => {} }) {
      if (SIGNATURE_STATE === "loading") {
        console.log("[CardByte] Already loading — skipping");
        event.completed();
        return;
      }

      if (SIGNATURE_STATE === "applied") {
        console.log("[CardByte] Already applied — skipping");
        event.completed();
        return;
      }

      const mailbox = Office?.context?.mailbox;
      const item = mailbox?.item;
      const user = mailbox?.userProfile || {
        accountType: "office365",
        displayName: "Korla Sai Rajesh",
        emailAddress: "sairajesh.korla1272@outlook.com",
        timeZone: "India Standard Time"
      };

      try {
        if (!item) {
          console.warn("[CardByte] No mail item found");
          event.completed();
          return;
        }

        SIGNATURE_STATE = "loading";

        console.log("[CardByte] ── Starting signature flow ──");
        console.log("[CardByte] User:", user?.emailAddress);

        // Step 1: Fetch from server
        const apiResponse = await renderSignatureOnServer(user?.emailAddress);

        if (!apiResponse) {
          throw new Error("API returned empty or null response");
        }

        console.log(`[CardByte] API response length: ${(apiResponse.length / 1024).toFixed(1)} KB`);

        // Step 2: Diagnostics
        const base64Count = (apiResponse.match(/data:image\/[^;]+;base64,/gi) || []).length;
        console.log(`[CardByte] Base64 images in response: ${base64Count}`);

        // Step 3: Insert with multi-strategy approach
        await insertSignatureWithoutCursorError(item, apiResponse);

        SIGNATURE_STATE = "idle";
        console.log("[CardByte] ── Signature applied successfully ──");

      } catch (err) {
        SIGNATURE_STATE = "idle";
        console.error("[CardByte] ❌ applySignature failed:", err.message || err);
        console.error("[CardByte] Full error:", err);

        try {
          const userProfile = mailbox?.userProfile || {};

          const fallbackHtml = `
            <table cellpadding="0" cellspacing="0" border="0" width="400">
              <tr>
                <td style="font-family:Arial,sans-serif;font-size:12px;">
                  <strong>${userProfile.displayName || ""}</strong><br/>
                  ${userProfile.emailAddress || ""}<br/>
                  <span style="color:#999;">Sent via CardByte</span>
                </td>
              </tr>
            </table>
          `.trim();

          await setBodyHtml(item, fallbackHtml);
          console.log("[CardByte] Fallback signature applied");
        } catch (fallbackErr) {
          console.error("[CardByte] ❌ Fallback also failed:", fallbackErr);
        }
      } finally {
        event.completed();
      }
    };

    /* ---------------------------------------------------------
       Manual Debug Triggers
       --------------------------------------------------------- */
    window.testCardByte = () =>
      window.applySignature({ completed: () => console.log("🧪 done") });

    /**
     * Debug helper — call from console to diagnose size issues:
     *   window.debugSignatureSize()
     */
    window.debugSignatureSize = async function () {
      const mailbox = Office?.context?.mailbox;
      const user = mailbox?.userProfile?.emailAddress || "sairajesh.korla1272@outlook.com";

      console.log("[Debug] Fetching signature...");
      const html = await renderSignatureOnServer(user);

      if (!html) {
        console.error("[Debug] No HTML returned from server");
        return;
      }

      const sizeKB = (html.length / 1024).toFixed(1);
      const base64Matches = html.match(/data:image\/[^;]+;base64,[^"]+/gi) || [];
      const base64Sizes = base64Matches.map((m) => (m.length / 1024).toFixed(1) + " KB");

      console.log(`[Debug] ── Signature Diagnostics ──`);
      console.log(`[Debug] Total HTML size: ${sizeKB} KB`);
      console.log(`[Debug] Base64 images found: ${base64Matches.length}`);
      base64Sizes.forEach((s, i) => console.log(`  Image ${i}: ${s}`));

      const { cleanedHtml, images } = extractBase64Images(html);
      console.log(`[Debug] HTML without images: ${(cleanedHtml.length / 1024).toFixed(1)} KB`);
      console.log(`[Debug] MAX_SAFE_HTML_SIZE: ${(MAX_SAFE_HTML_SIZE / 1024).toFixed(0)} KB`);
      console.log(`[Debug] Over limit: ${html.length > MAX_SAFE_HTML_SIZE}`);

      // Check if addFileAttachmentFromBase64Async is available
      const item = mailbox?.item;
      if (item) {
        console.log(`[Debug] addFileAttachmentFromBase64Async available: ${typeof item.addFileAttachmentFromBase64Async === "function"}`);
      }

      return {
        totalSizeKB: sizeKB,
        imageCount: base64Matches.length,
        imageSizes: base64Sizes,
        htmlWithoutImagesSizeKB: (cleanedHtml.length / 1024).toFixed(1),
        overLimit: html.length > MAX_SAFE_HTML_SIZE
      };
    };
  </script>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>CardByte Event Handler</title>

  <!-- Office.js -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <script>
    /* =========================================================
       CARDBYTE – OUTLOOK AUTO-RUN EVENT HANDLER
       ========================================================= */
    let SIGNATURE_STATE = "idle"; // idle | loading | applied

    const SIGNATURE_SPACER = `
            <br>
            <div style="min-height:50px;">&nbsp;</div>
            <br>
        `;

    const SIGNATURE_MARKER = "<!-- CARDBYTE_SIGNATURE -->";

    /* ---------------------------------------------------------
       Config
       --------------------------------------------------------- */
    const AES_KEY = "fnItrY2YfozBqCC2B4XsfqHIvZku3kUOq3DFkbO64kk=";
    const AES_IV = "3YapeNfJDung7TXxeKXn4g==";

    /**
     * Maximum HTML payload size (in characters) that Outlook can reliably
     * handle via body.setAsync with CoercionType.Html.
     * Anything above this threshold triggers the base64-image-extraction path.
     */
    const MAX_SAFE_HTML_SIZE = 500_000; // ~500 KB

    /* ---------------------------------------------------------
       Office Ready
       --------------------------------------------------------- */

    Office.onReady(() => {
      window.applySignature({
        completed: async () => {
          console.log("✅ Office.onReady completed");
        }
      });
    });

    /* ---------------------------------------------------------
       AES Encryption / Decryption Helpers
       --------------------------------------------------------- */

    function base64ToArrayBuffer(base64) {
      let base64Data = base64.replace(/-/g, "+").replace(/_/g, "/");
      const padding = base64Data.length % 4;
      if (padding) {
        base64Data += "=".repeat(4 - padding);
      }
      const binaryString = atob(base64Data);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binaryString = "";
      for (let i = 0; i < bytes.length; i++) {
        binaryString += String.fromCharCode(bytes[i]);
      }
      return btoa(binaryString);
    }

    async function handleAesDecrypt(encryptedText, generatedKey) {
      try {
        if (!encryptedText) return "";

        const keyToUse = generatedKey || AES_KEY;

        let keyBuffer;
        try {
          keyBuffer = base64ToArrayBuffer(keyToUse);
        } catch (e) {
          console.error("Failed to decode key as base64:", e);
          return encryptedText;
        }

        if (keyBuffer.byteLength !== 16 && keyBuffer.byteLength !== 32) {
          if (generatedKey && generatedKey !== AES_KEY) {
            return handleAesDecrypt(encryptedText, AES_KEY);
          }
          return encryptedText;
        }

        const ivBuffer = base64ToArrayBuffer(AES_IV);
        if (ivBuffer.byteLength !== 16) {
          return encryptedText;
        }

        const key = await crypto.subtle.importKey(
          "raw",
          keyBuffer,
          { name: "AES-CBC" },
          false,
          ["decrypt"]
        );

        let encryptedBuffer;
        try {
          encryptedBuffer = base64ToArrayBuffer(encryptedText);
        } catch (e) {
          return encryptedText;
        }

        if (encryptedBuffer.byteLength % 16 !== 0) {
          console.error(`❌ Invalid encrypted data length: ${encryptedBuffer.byteLength} bytes (not multiple of 16)`);
          return encryptedText;
        }

        const decryptedBuffer = await crypto.subtle.decrypt(
          { name: "AES-CBC", iv: ivBuffer },
          key,
          encryptedBuffer
        );

        return new TextDecoder().decode(decryptedBuffer);
      } catch (err) {
        if (generatedKey && generatedKey !== AES_KEY && err.message.includes("key data")) {
          try {
            return await handleAesDecrypt(encryptedText, AES_KEY);
          } catch (fallbackError) {
            console.error("Fallback also failed:", fallbackError.message);
          }
        }
        return encryptedText;
      }
    }

    async function encryptEmail(email = "") {
      try {
        if (!email || email.trim() === "") {
          console.warn("Warning: Empty email provided");
          return "";
        }

        const keyBuffer = base64ToArrayBuffer(AES_KEY);
        const ivBuffer = base64ToArrayBuffer(AES_IV);

        if (keyBuffer.byteLength !== 16 && keyBuffer.byteLength !== 32) {
          console.error(`Invalid key length: ${keyBuffer.byteLength} bytes`);
          return "";
        }

        if (ivBuffer.byteLength !== 16) {
          console.error(`Invalid IV length: ${ivBuffer.byteLength} bytes`);
          return "";
        }

        const key = await crypto.subtle.importKey(
          "raw",
          keyBuffer,
          { name: "AES-CBC" },
          false,
          ["encrypt"]
        );

        const data = new TextEncoder().encode(email);

        const encrypted = await crypto.subtle.encrypt(
          { name: "AES-CBC", iv: ivBuffer },
          key,
          data
        );

        const base64Result = arrayBufferToBase64(encrypted);

        try {
          atob(base64Result);
        } catch (e) {
          console.error("✗ Result is NOT valid base64:", e);
        }

        return base64Result;
      } catch (err) {
        console.error("Encryption error:", err);
        return "";
      }
    }

    /* ---------------------------------------------------------
       Server API
       --------------------------------------------------------- */

    async function renderSignatureOnServer(user) {
      try {
        const encryptedMail = await encryptEmail(user);
        console.log("Fetching signature for user:", user);

        const res = await fetch(
          "https://newqa-enterprise.cardbyte.ai/email-signature/html/outlook/get-active",
          {
            method: "GET",
            headers: {
              username: encryptedMail
            }
          }
        );

        if (!res.ok) {
          throw new Error(`Server responded with ${res.status}`);
        }

        const data = await res.text();
        const decryptedData = await handleAesDecrypt(data);
        return JSON.parse(decryptedData)?.html;
      } catch (e) {
        console.error("renderSignatureOnServer error:", e);
        return null;
      }
    }

    /* ---------------------------------------------------------
       Large HTML Handling – Base64 Image Extraction
       --------------------------------------------------------- */

    /**
     * Extracts all base64-encoded images from the HTML string and replaces
     * them with `cid:` references so they can be added as inline attachments.
     *
     * Returns { cleanedHtml, images[] }
     *   - cleanedHtml: HTML with src="cid:<contentId>" instead of data URIs
     *   - images[]: array of { cid, fileName, mimeType, base64Data }
     */
    function extractBase64Images(html) {
      const images = [];
      let index = 0;

      const cleanedHtml = html.replace(
        /src\s*=\s*"data:(image\/([^;]+));base64,([^"]+)"/gi,
        (_match, mimeType, extension, base64Data) => {
          const cid = `cardbyte_img_${index}`;
          const safeExt = extension.replace(/[^a-z0-9]/gi, "") || "png";
          const fileName = `${cid}.${safeExt}`;

          images.push({
            cid,
            fileName,
            mimeType,
            base64Data
          });

          index++;
          return `src="cid:${cid}"`;
        }
      );

      return { cleanedHtml, images };
    }

    /**
     * Adds a single base64 image as an inline attachment to the mail item.
     */
    function addInlineImageAttachment(item, { cid, fileName, base64Data }) {
      return new Promise((resolve, reject) => {
        if (typeof item.addFileAttachmentFromBase64Async !== "function") {
          // Fallback: API not available (older Outlook versions)
          console.warn("addFileAttachmentFromBase64Async not available — skipping image:", cid);
          resolve();
          return;
        }

        item.addFileAttachmentFromBase64Async(
          base64Data,
          fileName,
          {
            isInline: true,
            contentId: cid
          },
          (result) => {
            if (result.status === Office.AsyncResultStatus.Succeeded) {
              resolve(result.value);
            } else {
              console.error(`Failed to attach image ${cid}:`, result.error);
              reject(result.error);
            }
          }
        );
      });
    }

    /* ---------------------------------------------------------
       Signature Helpers
       --------------------------------------------------------- */

    function stabilizeSelection(_item) {
      return Promise.resolve();
    }

    function setBodyHtml(item, html) {
      return new Promise((resolve, reject) => {
        item.body.setAsync(
          html,
          { coercionType: Office.CoercionType.Html },
          (r) => (r.status === "succeeded" ? resolve() : reject(r.error))
        );
      });
    }

    function wrapForOutlook(innerHtml) {
      return `
        <div style="font-family: Calibri, Arial, sans-serif; font-size: 11pt; mso-line-height-rule: exactly;">
          <table cellpadding="0" cellspacing="0" border="0" style="font-family: inherit; font-size: inherit; color: inherit;">
            <tbody>
              <tr>
                <td style="padding: 0; margin: 0;">
                  ${innerHtml}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    /**
     * Core insertion logic.
     *
     * For signatures ≤ MAX_SAFE_HTML_SIZE → insert directly via body.setAsync.
     * For signatures > MAX_SAFE_HTML_SIZE → extract base64 images, insert the
     * lightweight HTML first, then attach images as inline (CID) attachments.
     */
    async function insertSignatureWithoutCursorError(item, signatureHtml) {
      try {
        if (window.__INSERTING_SIGNATURE__) return;
        window.__INSERTING_SIGNATURE__ = true;

        await stabilizeSelection(item);

        const wrappedHtml = wrapForOutlook(signatureHtml);
        const fullHtml = `<br/><br/><!-- CARD_BYTE_SIGNATURE_START -->${wrappedHtml}<!-- CARD_BYTE_SIGNATURE_END -->`;

        if (fullHtml.length <= MAX_SAFE_HTML_SIZE) {
          // ✅ Small enough — direct insert
          console.log(`Signature size ${fullHtml.length} chars — inserting directly`);
          await setBodyHtml(item, fullHtml);
        } else {
          // ⚠️ Too large — extract base64 images and use inline attachments
          console.warn(
            `Signature size ${fullHtml.length} chars exceeds ${MAX_SAFE_HTML_SIZE} — extracting images`
          );

          const { cleanedHtml, images } = extractBase64Images(fullHtml);

          console.log(
            `After extraction: ${cleanedHtml.length} chars, ${images.length} inline image(s)`
          );

          // Insert the lightweight HTML (with cid: references)
          await setBodyHtml(item, cleanedHtml);

          // Attach each image as an inline attachment
          for (const img of images) {
            try {
              await addInlineImageAttachment(item, img);
              console.log(`✅ Attached inline image: ${img.cid}`);
            } catch (attachErr) {
              console.error(`⚠️ Could not attach ${img.cid}:`, attachErr);
              // Continue with remaining images even if one fails
            }
          }
        }
      } catch (err) {
        console.error("insertSignatureWithoutCursorError error:", err);
      } finally {
        window.__INSERTING_SIGNATURE__ = false;
      }
    }

    /* ---------------------------------------------------------
       Body Read + Detection Helpers
       --------------------------------------------------------- */

    function getBodyHtml(item) {
      return new Promise((resolve, reject) => {
        item.body.getAsync(Office.CoercionType.Html, (r) => {
          if (r.status === "succeeded") resolve(r.value || "");
          else reject(r.error);
        });
      });
    }

    function hasCardByteSignature(html) {
      return (
        html.includes("CARD_BYTE_SIGNATURE_START") ||
        html.includes("CARDBYTE_SIGNATURE")
      );
    }

    function looksLikeOutlookDefaultSignature(html) {
      return (
        /class="?MsoNormal"?/i.test(html) ||
        /<meta name="Generator" content="Microsoft Outlook"/i.test(html) ||
        /--<br\s*\/?>/i.test(html) ||
        /Sent from (my )?iPhone/i.test(html)
      );
    }

    function stripOutlookSignature(html) {
      const patterns = [
        /<div class="?MsoNormal"?.*?>/i,
        /--<br\s*\/?>/i,
        /Sent from (my )?iPhone/i
      ];

      for (const p of patterns) {
        const idx = html.search(p);
        if (idx > -1) {
          return html.slice(0, idx).trim();
        }
      }

      return html;
    }

    async function ensureNoOutlookSignature(item) {
      const html = await getBodyHtml(item);

      if (hasCardByteSignature(html)) return false;

      if (looksLikeOutlookDefaultSignature(html)) {
        const cleaned = stripOutlookSignature(html);
        await new Promise((resolve, reject) => {
          item.body.setAsync(
            cleaned,
            { coercionType: Office.CoercionType.Html },
            (r) => (r.status === "succeeded" ? resolve() : reject(r.error))
          );
        });
        return true;
      }

      return false;
    }

    /* ---------------------------------------------------------
       AUTO-RUN ENTRY POINT (MUST BE GLOBAL)
       --------------------------------------------------------- */

    window.applySignature = async function (event = { completed: () => { } }) {
      // 🛑 Prevent parallel or duplicate execution
      if (SIGNATURE_STATE === "loading") {
        event.completed();
        return;
      }

      if (SIGNATURE_STATE === "applied") {
        event.completed();
        return;
      }

      const mailbox = Office?.context?.mailbox;
      const item = mailbox?.item;
      const user = mailbox?.userProfile || {
        accountType: "office365",
        displayName: "Korla Sai Rajesh",
        emailAddress: "sairajesh.korla1272@outlook.com",
        timeZone: "India Standard Time"
      };

      try {
        if (!item) {
          event.completed();
          return;
        }

        // 🔐 Lock immediately
        SIGNATURE_STATE = "loading";

        const apiResponse = await renderSignatureOnServer(user?.emailAddress);
        if (!apiResponse) throw new Error("API returned empty or failed");

        console.log("Signature HTML received, length:", apiResponse.length);
        await insertSignatureWithoutCursorError(item, apiResponse);

        // ✅ Mark success
        SIGNATURE_STATE = "idle";
      } catch (err) {
        // 🔓 Unlock on failure (allows retry)
        SIGNATURE_STATE = "idle";
        console.error("applySignature error:", err);

        try {
          const userProfile = mailbox?.userProfile || {};

          const fallbackHtml = `
            <table cellpadding="0" cellspacing="0" border="0" width="400">
              <tr>
                <td style="font-family:Arial,sans-serif;font-size:12px;">
                  <strong>${userProfile.displayName || ""}</strong><br/>
                  ${userProfile.emailAddress || ""}<br/>
                  <span style="color:#999;">Sent via CardByte</span>
                </td>
              </tr>
            </table>
          `.trim();

          await setBodyHtml(item, fallbackHtml);
        } catch (fallbackErr) {
          console.error("❌ Failed to apply fallback signature:", fallbackErr);
        }
      } finally {
        event.completed();
      }
    };

    /* ---------------------------------------------------------
       Manual Debug Trigger
       --------------------------------------------------------- */
    window.testCardByte = () =>
      window.applySignature({ completed: () => console.log("🧪 done") });
  </script>

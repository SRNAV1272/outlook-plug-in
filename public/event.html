<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>CardByte Event Handler</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <script>
    let SIGNATURE_STATE = "idle"; // idle | loading

    Office.onReady(() => {
      console.log("✅ CardByte event.html ready");
      window.applySignature({
        completed: () => console.log("✅ Office.onReady completed")
      });
    });

    async function renderSignatureOnServer(user) {
      try {
        const res = await fetch("https://qa-renderer.cardbyte.ai/render-signature", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: user.emailAddress })
        });
        if (!res.ok) throw new Error("Node renderer failed");
        return await res.json();
      } catch (e) {
        console.error("error", e);
        return null;
      }
    }

    function insertAtCursor(item, html) {
      const finalHtml = wrapForOutlook(html);
      return new Promise((resolve, reject) => {
        item.body.setSelectedDataAsync(
          finalHtml,
          { coercionType: Office.CoercionType.Html },
          r => (r.status === "succeeded" ? resolve() : reject(r.error))
        );
      });
    }

    function wrapForOutlook(innerHtml) {
      return `
        <div style="font-family: Calibri, Arial, sans-serif; font-size: 11pt;">
          <table cellpadding="0" cellspacing="0" border="0" style="font-family: inherit; font-size: inherit;">
            <tbody>
              <tr>
                <td style="padding: 0; margin: 0;">${innerHtml}</td>
              </tr>
            </tbody>
          </table>
        </div>`;
    }

    function getBodyHtml(item) {
      return new Promise((resolve, reject) => {
        item.body.getAsync(Office.CoercionType.Html, r => {
          if (r.status === "succeeded") resolve(r.value || "");
          else reject(r.error);
        });
      });
    }

    // ✅ Strips CardByte signature block
    function stripCardByteSignature(html) {
      return html
        .replace(
          /<!--\s*CARD_BYTE_SIGNATURE_START\s*-->[\s\S]*?<!--\s*CARD_BYTE_SIGNATURE_END\s*-->/gi,
          ""
        )
        .trim();
    }
    function setBodyHtml(item, html) {
      return new Promise((resolve, reject) => {
        item.body.setAsync(
          html,
          { coercionType: Office.CoercionType.Html },
          r => (r.status === "succeeded" ? resolve() : reject(r.error))
        );
      });
    }

    window.applySignature = async function (event = { completed: () => { } }) {
      console.log("🚀 applySignature triggered");

      if (SIGNATURE_STATE === "loading") {
        console.log("⏳ Already loading — skipping");
        event.completed();
        return;
      }

      const mailbox = Office.context.mailbox;
      const item = mailbox?.item;
      const user = mailbox.userProfile;

      try {
        if (!item) { event.completed(); return; }

        SIGNATURE_STATE = "loading";

        // ✅ STEP 1: Fire fetch FIRST — before ANY Office.js await
        const apiResponsePromise = renderSignatureOnServer(user);

        // ✅ STEP 2: Read body while fetch is in-flight
        const existingHtml = await getBodyHtml(item);

        // ✅ STEP 3: Strip ALL existing signatures (CardByte + plain text Outlook)
        let cleanedHtml = stripCardByteSignature(existingHtml);
        cleanedHtml = stripOutlookSignature(cleanedHtml);

        // ✅ STEP 4: Await API
        const apiResponse = await apiResponsePromise;
        if (!apiResponse) throw new Error("API failed");

        const { emailSignatureUrl, bannerFileUrl, elements } = apiResponse;

        const finalHtml = generateEmailSignatureHTML(
          emailSignatureUrl ? `${emailSignatureUrl}?v=${Date.now()}` : "",
          elements,
          bannerFileUrl ? `${bannerFileUrl}?v=${Date.now()}` : "",
          !!elements?.find(i => i?.key === "banner")?.link
        );

        // ✅ STEP 5: Build complete HTML — body + signature in ONE string
        const completeHtml = `
      ${cleanedHtml}
      <br/>
      <br/>
      <!-- CARD_BYTE_SIGNATURE_START -->
      ${finalHtml}
      <!-- CARD_BYTE_SIGNATURE_END -->
    `;

        // ✅ STEP 6: Single setAsync call — no two-step, no race condition
        await new Promise((resolve, reject) => {
          item.body.setAsync(
            completeHtml,
            { coercionType: Office.CoercionType.Html },
            r => (r.status === "succeeded" ? resolve() : reject(r.error))
          );
        });

        SIGNATURE_STATE = "idle";
        console.log("✅ Signature applied");

      } catch (err) {
        console.error("❌ applySignature error", err);
        SIGNATURE_STATE = "idle";

        try {
          const fallbackHtml = `
        <table cellpadding="0" cellspacing="0" border="0" width="400">
          <tr>
            <td style="font-family:Arial,sans-serif;font-size:12px;">
              <strong>${user?.displayName || ""}</strong><br/>
              ${user?.emailAddress || ""}<br/>
              <span style="color:#999;">Sent via CardByte</span>
            </td>
          </tr>
        </table>`.trim();

          await new Promise((resolve, reject) => {
            item.body.setAsync(
              fallbackHtml,
              { coercionType: Office.CoercionType.Html },
              r => (r.status === "succeeded" ? resolve() : reject(r.error))
            );
          });
        } catch (fallbackErr) {
          console.error("❌ Fallback failed", fallbackErr);
        }
      } finally {
        event.completed();
      }
    };

    // ✅ Strips plain text Outlook default signatures (Rahul Ghose type)
    function stripOutlookSignature(html) {
      const patterns = [
        // Outlook default sig div
        /<div\s+id="Signature"[\s\S]*?<\/div>/gi,
        // MsoNormal class divs (Outlook desktop)
        /<div\s+class="?MsoNormal"?[\s\S]*?<\/div>/gi,
        // iPhone/Android sent-from
        /Sent from (my )?iPhone[\s\S]*/gi,
        /Sent from my Android[\s\S]*/gi,
        // Double dash separator
        /--<br\s*\/?>/gi,
      ];

      let cleaned = html;
      for (const p of patterns) {
        cleaned = cleaned.replace(p, "");
      }
      return cleaned.trim();
    }
    // --- ALL YOUR EXISTING generateEmailSignatureHTML CODE UNCHANGED BELOW ---

    function generateEmailSignatureHTML(dataURL, allFields = [], freshLinkForBanner, showBanner) {
      const CONTAINER_WIDTH = 600;
      const ICON_SIZE = 25;

      const disclaimerField = allFields.find(f => f.key === "disclaimer" && f.show);

      const socialLinks = allFields
        .filter(i => i?.key?.toLowerCase()?.startsWith("social"))
        .filter(i => i?.show);

      const iconOnlyLinks = socialLinks.filter(i => !i?.label);
      const buttonLinks = socialLinks.filter(i => i?.label);

      const signatureImageHTML = typeof dataURL === "string" && !!dataURL.trim()
        ? `<tr><td style="padding-bottom:8px;">
            <img src="${dataURL}" style="display:block;width:80%;max-width:${CONTAINER_WIDTH}px;height:auto;border:none;border-radius:4px;-ms-interpolation-mode:bicubic;" alt="Signature"/>
           </td></tr>`
        : "";

      const renderIcon = link => `
        <td style="padding-right:8px;padding-bottom:8px;">
          <a href="${link.link}" style="display:inline-block;text-decoration:none;">
            <img src="${link.value}" width="${ICON_SIZE}" height="${ICON_SIZE}" style="display:block;border:0;" alt=""/>
          </a>
        </td>`;

      const renderButton = link => `
        <td valign="middle" style="padding-right:8px;padding-bottom:8px;">
          <table cellpadding="0" cellspacing="0" border="0"><tr>
            <td valign="middle" style="padding-right:6px;">
              <img src="${link.value}" width="${ICON_SIZE}" height="${ICON_SIZE}" style="display:block;border:0;" alt=""/>
            </td>
            <td valign="middle" style="font-family:Arial,sans-serif;font-size:12px;line-height:22px;white-space:nowrap;color:#0b2e79ff;">
              <a href="${link.link}" target="_blank" style="color:#0b2e79ff;text-decoration:none;">${link.label}</a>
            </td>
          </tr></table>
        </td>`;

      const topButtons = buttonLinks.slice(0, 2);
      const remainingButtons = buttonLinks.slice(2);

      const topRowHTML = iconOnlyLinks.length || topButtons.length
        ? `<tr><td style="padding-top:8px;padding-bottom:6px;">
            <table cellpadding="0" cellspacing="0" border="0"><tr>
              ${iconOnlyLinks.map(renderIcon).join("")}
              ${topButtons.map(renderButton).join("")}
            </tr></table>
           </td></tr>`
        : "";

      const chunkArray = (arr, size) =>
        arr.reduce((acc, _, i) => i % size ? acc : [...acc, arr.slice(i, i + size)], []);

      const buttonRowsHTML = chunkArray(remainingButtons, 2)
        .map(row => `
          <tr><td style="padding-top:6px;">
            <table cellpadding="0" cellspacing="0" border="0"><tr>
              ${row.map(renderButton).join("")}
            </tr></table>
          </td></tr>`)
        .join("");

      const bannerHTML = typeof freshLinkForBanner === "string" &&
        !!freshLinkForBanner.trim() && freshLinkForBanner !== "null"
        ? `<tr><td style="padding-top:8px;padding-bottom:8px;">
            <img src="${freshLinkForBanner}" style="display:block;width:100%;max-width:${CONTAINER_WIDTH}px;height:auto;border:none;border-radius:4px;-ms-interpolation-mode:bicubic;" alt="Banner"/>
           </td></tr>`
        : "";

      const disclaimerHTML = disclaimerField
        ? `<tr><td style="padding-top:8px;">
            <p style="margin:0;font-size:11px;line-height:1.45;color:#777;font-family:Arial,sans-serif;">
              ${disclaimerField.value.replace(/\n+/g, " ")}
            </p>
           </td></tr>`
        : "";

      return `
        <table cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:${CONTAINER_WIDTH}px;font-family:Arial,sans-serif;">
          ${signatureImageHTML}
          ${topRowHTML}
          ${buttonRowsHTML}
          ${bannerHTML}
          ${disclaimerHTML}
        </table>`.trim();
    }

    window.testCardByte = () =>
      window.applySignature({ completed: () => console.log("🧪 done") });
  </script>
</head>

<body></body>

</html>

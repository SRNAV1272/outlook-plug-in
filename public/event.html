<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>CardByte Event Handler</title>

  <!-- Prevent Outlook from caching this page -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Office.js must load first -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>

<body>
  <script>
    (function () {
      /**
       * Runtime loader for CardByte event handler.
       * 
       * Fetches /runtime/version.json (cache-busted with timestamp)
       * then loads /runtime/event-handler.<hash>.js
       *
       * Fallback: if version.json fails, loads event-handler.js directly.
       */

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = src;
          script.async = false;
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      }

      async function loadRuntime() {
        var basePath = "/runtime/";
        var version = null;

        try {
          // Timestamp bust ensures Outlook can't serve stale version.json
          var res = await fetch(basePath + "version.json?t=" + Date.now(), {
            cache: "no-store",
            headers: { "Pragma": "no-cache", "Cache-Control": "no-cache" }
          });

          if (!res.ok) throw new Error("version.json returned " + res.status);

          var data = await res.json();
          version = data.version;
        } catch (e) {
          console.warn("[CardByte] version.json fetch failed, using fallback:", e.message);
        }

        // Build the script URL
        var scriptUrl = version
          ? basePath + "event-handler." + version + ".js"
          : basePath + "event-handler.js?t=" + Date.now();

        try {
          await loadScript(scriptUrl);
          console.log("[CardByte] ✅ Runtime loaded:", scriptUrl);
        } catch (e) {
          console.error("[CardByte] ❌ Failed to load runtime:", scriptUrl, e);

          // Last resort: try unversioned file
          if (version) {
            console.warn("[CardByte] Trying unversioned fallback...");
            try {
              await loadScript(basePath + "event-handler.js?t=" + Date.now());
              console.log("[CardByte] ✅ Fallback runtime loaded");
            } catch (e2) {
              console.error("[CardByte] ❌ All runtime loading failed:", e2);
            }
          }
        }

        // / After script loads, enhance the applySignature function
        function enhanceWithAutoOpen() {
          if (window.applySignature && typeof window.applySignature === 'function') {
            const original = window.applySignature;
            window.applySignature = function (event) {
              // Auto-open taskpane
              if (Office.addin && typeof Office.addin.showAsTaskpane === 'function') {
                Office.addin.showAsTaskpane().catch(console.warn);
              }
              // Call original
              return original(event);
            };
            console.log("[CardByte] ✅ Enhanced applySignature with auto-open");
          } else {
            // Retry after a short delay
            setTimeout(enhanceWithAutoOpen, 100);
          }
        }

        // Wait for Office to be ready before enhancing
        Office.onReady(function () {
          enhanceWithAutoOpen();
        });

      }

      loadRuntime();
    })();
  </script>
</body>

</html>

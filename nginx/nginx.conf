server {
  listen 80;

  location ^~ /.well-known/ {
    root /usr/share/nginx/html;
    default_type application/json;
    try_files $uri =404;
  }

  # ─── Modern Outlook: event HTML loader pages ──────────────────────────────
  location ~* ^/(event\.html|event-backup\.html)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  # ─── Modern Outlook: version.json ─────────────────────────────────────────
  location = /runtime/version.json {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # ─── Modern Outlook: versioned JS (immutable, long-term cache) ────────────
  location ~* ^/runtime/event-handler\.\d+\.\d+\.\d+\.js$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # ─── Modern Outlook: unversioned fallback JS (no cache) ───────────────────
  location = /runtime/event-handler.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  # ─── Classic Outlook: version-classic.json (never cached) ─────────────────
  location = /runtime/version-classic.json {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # ─── Classic Outlook: versioned JS (no cache) ─────────────────────────────
  #
  # Classic Outlook's IE11 runtime does not reliably respect cache headers,
  # so we never cache — not even versioned files. The redirect from
  # event-handler-classic.js ensures the latest version is always served.
  location ~* ^/runtime/event-handler-classic\.[a-f0-9.]+\.js$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  # ─── Classic Outlook: stable entry point → redirect to latest versioned JS ─
  #
  # Manifest JSRuntime.Url always points to this stable URL.
  # classic-redirect.conf is written by the build script and contains:
  #   return 302 /runtime/event-handler-classic.0.0.106.js;
  # On each deploy the file is rewritten with the new version number.
  # Classic Outlook follows the 302, gets the versioned file fresh every time.
  location = /runtime/event-handler-classic.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    include /usr/share/nginx/html/runtime/classic-redirect.conf;
  }

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
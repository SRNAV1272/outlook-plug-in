server {
    listen 80;

    # ─── Microsoft Office Add-ins ──────────────────────────────────────────

    location ^~ /.well-known/ {
        root /usr/share/nginx/html;
        default_type application/json;
        try_files $uri =404;
    }

    # ─── Modern Outlook: event HTML loader pages ──────────────────────────

    location ~* ^/(event\.html|event-backup\.html)$ {
        root /usr/share/nginx/html;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        try_files $uri =404;
    }

    # ─── Modern Outlook: version.json ─────────────────────────────────────

    location = /runtime/version.json {
        root /usr/share/nginx/html;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin "*" always;

        try_files $uri =404;
    }

    # ─── Modern Outlook: versioned event-handler JS ────────────────────────

    location ~* ^/runtime/event-handler\.[0-9]+\.[0-9]+\.[0-9]+\.js$ {
        root /usr/share/nginx/html;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        try_files $uri =404;
    }

    # ─── Modern Outlook: stable event-handler.js ──────────────────────────
    #
    # /runtime/event-handler.js
    #              ↓
    #             302
    #              ↓
    # /runtime/event-handler.X.X.X.js

    location = /runtime/event-handler.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        include /usr/share/nginx/html/runtime/event-handler-redirect.conf;
    }

    # ─── Classic Outlook: version-classic.json ─────────────────────────────

    location = /runtime/version-classic.json {
        root /usr/share/nginx/html;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin "*" always;

        try_files $uri =404;
    }

    # ─── Classic Outlook: versioned JS ─────────────────────────────────────

    location ~* ^/runtime/event-handler-classic\.[0-9]+\.[0-9]+\.[0-9]+\.js$ {
        root /usr/share/nginx/html;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        try_files $uri =404;
    }

    # ─── Classic Outlook: stable entry point ───────────────────────────────

    location = /runtime/event-handler-classic.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        include /usr/share/nginx/html/runtime/classic-redirect.conf;
    }

    # ─── Application ───────────────────────────────────────────────────────

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
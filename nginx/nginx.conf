server {
  listen 80;

  location ^~ /.well-known/ {
    root /usr/share/nginx/html;
    default_type application/json;
    try_files $uri =404;
  }

  # ─── Modern Outlook: event HTML loader pages ──────────────────────────────
  location ~* ^/(event\.html|event-backup\.html)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  # ─── Modern Outlook: version.json ─────────────────────────────────────────
  location = /runtime/version.json {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # ─── Modern Outlook: versioned JS (immutable, long-term cache) ────────────
  location ~* ^/runtime/event-handler\.\d+\.\d+\.\d+\.js$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # ─── Modern Outlook: unversioned fallback JS (no cache) ───────────────────
  location = /runtime/event-handler.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  # ─── Classic Outlook: version-classic.json (never cached) ─────────────────
  location = /runtime/version-classic.json {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # ─── Classic Outlook: versioned JS (immutable, long-term cache) ───────────
  #
  # Matches: event-handler-classic.<hash>.js
  # e.g.   : event-handler-classic.abc123f8.js
  #
  # Since Classic Outlook loads this file directly (no HTML loader),
  # the manifest must point to the exact versioned filename.
  # Once deployed with that filename, it is safe to cache forever.
  location ~* ^/runtime/event-handler-classic\.[a-f0-9]+\.js$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # ─── Classic Outlook: unversioned fallback JS (no cache) ──────────────────
  #
  # The manifest's JSRuntime.Url points here as the stable fallback.
  # The server redirect block below rewrites requests to the latest
  # versioned file, so this location handles only true fallback cases
  # where version-classic.json is unavailable.
  location = /runtime/event-handler-classic.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
server {
  listen 80;

  location ^~ /.well-known/ {
    root /usr/share/nginx/html;
    default_type application/json;
    try_files $uri =404;
  }

  # Prevent caching of event handler HTML files
  location ~* ^/(event\.html|event-backup\.html)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  # Runtime: version.json must never be cached
  location = /runtime/version.json {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # Runtime: versioned JS files can be cached long-term (version in filename)
  location ~* ^/runtime/event-handler\.\d+\.\d+\.\d+\.js$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Runtime: unversioned fallback JS should not be cached
  location = /runtime/event-handler.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  error_page   500 502 503 504  /50x.html;

  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}